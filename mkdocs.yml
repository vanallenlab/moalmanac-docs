site_name: Molecular Oncology Almanac Documentation
site_url: https://vanallenlab.github.io/moalmanac-docs/
theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - content.code.copy
  palette:
    primary: custom
    accent: custom

extra_css:
- stylesheets/extra.css

plugins:
  - search
  - blog:
      blog_dir: news
      archive_name: Archives
      post_url_format: "{slug}"
  - rss:
      feed_title: Molecular Oncology Almanac News
      match_path: "news/posts/.*"
      date_from_meta:
        as_creation: date
      categories:
        - categories

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

